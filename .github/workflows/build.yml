name: Compilar TouchPad.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Generar icono
        run: python make_icon.py

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name TouchPad
          --icon build/icon.ico
          --paths touchpad
          --add-data "touchpad/ui.html;."
          --add-data "touchpad/phone.html;."
          --hidden-import pystray._win32
          --collect-all webview
          touchpad/app.py

      - name: Subir el .exe (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TouchPad
          path: dist/TouchPad.exe

      - name: Publicar en Releases (solo al crear una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TouchPad.exe
