name: Compilar TouchPad

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Generar icono
        run: python make_icon.py
      - name: Compilar TouchPad.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name TouchPad
          --icon build/icon.ico
          --paths touchpad
          --add-data "touchpad/ui.html;."
          --add-data "touchpad/phone.html;."
          --hidden-import pystray._win32
          --collect-all webview
          touchpad/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TouchPad-Windows
          path: dist/TouchPad.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Generar icono
        run: python make_icon.py
      - name: Compilar TouchPad.app
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name TouchPad
          --icon build/icon.png
          --osx-bundle-identifier com.hectoormv.touchpad
          --paths touchpad
          --add-data "touchpad/ui.html:."
          --add-data "touchpad/phone.html:."
          --hidden-import webview.platforms.cocoa
          touchpad/app.py
      - name: Empaquetar en zip
        run: ditto -c -k --keepParent dist/TouchPad.app dist/TouchPad-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TouchPad-Mac
          path: dist/TouchPad-Mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/TouchPad-Windows/TouchPad.exe
            out/TouchPad-Mac/TouchPad-Mac.zip
